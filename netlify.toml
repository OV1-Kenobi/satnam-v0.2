# Satnam v2 — Netlify Configuration
# Target: ≤8 serverless functions, CSP enforced, zero key material on server

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--prefer-offline"

# ─── Security Headers ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # CSP: no unsafe-eval, no external fonts, wasm-unsafe-eval for FROSTR bifrost
    # H-4 fix (2026-08-25): connect-src rewritten with an EXPLICIT relay
    # allowlist inventoried from src/, public/sw.js and index.html. The old
    # wss://*.nostr.com / wss://*.relay.* wildcards could never match real
    # hosts (CSP host wildcards are leading-label only), silently blocking
    # relay.damus.io, nos.lol, relay.nostr.band etc. in production.
    # Founder Decision 3 carve-out: the NWC wallet-relay catalog below mirrors
    # nwc-proxy ALLOWED_RELAY_PREFIXES so user-configured Nostr Wallet Connect
    # relays stay functional client-side. All hosts remain EXPLICIT — no
    # wildcards reintroduced. Residual exposure (documented in engineering
    # notes 2026-08-25): these are third-party WS origins; NWC payloads are
    # NIP-44 end-to-end encrypted, so a listed relay sees ciphertext plus
    # metadata only. Relays OUTSIDE this catalog stay blocked pending the
    # future nwc-proxy transport upgrade.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://pylon.openagents.com wss://relay.satnam.pub wss://nos.lol wss://relay.damus.io wss://relay.nostr.band wss://nostr.wine wss://relay.primal.net wss://relay.getalby.com wss://relay.mutinywallet.com wss://nostr.mutinywallet.com wss://nostr.bitcoiner.social https://*.supabase.co; img-src 'self' data: blob: https:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ─── PWA Service Worker ─────────────────────────────────────────────
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# ─── Font Caching ───────────────────────────────────────────────────
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ─── NIP-05 well-known ──────────────────────────────────────────────
[[redirects]]
  from = "/.well-known/nostr.json"
  to = "/.netlify/functions/nip05-resolver"
  status = 200
  force = true

# ─── NIP-SA agent discovery ─────────────────────────────────────────
[[redirects]]
  from = "/.well-known/agent.json"
  to = "/.netlify/functions/well-known-agent"
  status = 200
  force = true

# ─── SPA Routing ────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Feature Flags ──────────────────────────────────────────────────
[context.production.environment]
  VITE_PYLON_RELAY = "wss://pylon.openagents.com"
  VITE_FX_ENABLED = "false"
  VITE_BIFROST_ENABLED = "false"
  VITE_ENABLE_NFC = "true"
  VITE_ENABLE_CASHU = "false"
  VITE_ENABLE_NIP90 = "false"
  VITE_PROBE_ENABLED = "false"
