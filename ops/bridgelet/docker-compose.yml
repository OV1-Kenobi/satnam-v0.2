services:
  bridgelet:
    image: node:20-alpine
    command: sh -c "npm i && node server.js"
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - CLINK_RELAY=wss://relay.satnam.pub
      - DOMAIN=bridge.satnam.pub
      - DRY_RUN=true
    restart: unless-stopped
